<style>
:root{--bg:#fff;--card:#fff;--text:#1b2638;--muted:#66758b;--acc:#0e8fb0;--acc2:#0a7592;--on:#fff;--tile:#f4f6f7;--line:#e6eaec;--serif:Georgia,'Times New Roman',serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:var(--hh,100px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.55;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:30;border-bottom:1px solid var(--line)}
.nav{max-width:1150px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:54px auto;grid-template-areas:"brand tools" "links links";padding:0 16px;column-gap:10px;align-items:center}
.brand{grid-area:brand;display:flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;min-width:0}
.brand img{height:42px;width:auto;display:block}
#name{max-width:110px;font-family:var(--serif);font-weight:700;font-size:.8rem;line-height:1.12;letter-spacing:.07em;text-transform:uppercase}
.tools{grid-area:tools;display:flex;align-items:center;gap:8px}
.lg{display:flex;align-items:center;gap:3px;border:1.5px solid var(--line);border-radius:99px;padding:3px 6px 3px 8px;color:var(--acc)}
.lg svg{width:15px;height:15px}
.lg select{border:0;background:none;color:var(--text);font-size:.8rem;font-weight:600;outline:none;cursor:pointer;font-family:inherit}
.ax{display:flex;align-items:center;color:var(--text);padding:4px}.ax svg{width:20px;height:20px}
.hsearch{display:flex;align-items:center;border:1.5px solid var(--acc);border-radius:99px;padding:3px 10px;width:130px;gap:6px;background:var(--card)}
.hsearch input{border:0;background:none;outline:none;width:100%;color:var(--text);font-size:.85rem;font-family:inherit;min-width:0}
.hsearch svg{width:16px;height:16px;color:var(--acc);flex-shrink:0}
@media(max-width:560px){.hsearch{width:96px}#name{max-width:96px;font-size:.72rem}}
@media(max-width:430px){#igTop{display:none}}
@media(max-width:350px){#name{display:none}}
.links{grid-area:links;display:flex;gap:2px;overflow-x:auto}
.links a{padding:9px 11px;color:var(--text);opacity:.8;text-decoration:none;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.links a.act{color:var(--acc);border-color:var(--acc);opacity:1}
@media(min-width:900px){.nav{grid-template-columns:auto 1fr auto;grid-template-rows:62px;grid-template-areas:"brand links tools";column-gap:18px}.hsearch{width:210px}.links{justify-content:center}}
#sug{position:fixed;left:8px;right:8px;max-width:420px;margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:45;display:none;max-height:60vh;overflow:auto}
#sug.open{display:block}
#sug button{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;cursor:pointer;color:var(--text);font:inherit}
#sug img{width:44px;height:44px;border-radius:6px;object-fit:cover;flex-shrink:0}
#sug b{display:block;font-size:.88rem;font-weight:600}#sug span{font-size:.72rem;color:var(--muted)}
.sugf{padding:11px;text-align:center;font-size:.85rem;color:var(--muted)}.sugf a{color:var(--acc);font-weight:600;text-decoration:none;cursor:pointer}
.btn{display:inline-block;background:var(--acc);color:var(--on);padding:13px 28px;border-radius:99px;text-decoration:none;font-weight:600;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--acc);cursor:pointer;text-align:center}
.btn:hover{background:var(--acc2);border-color:var(--acc2)}
.btn.out{background:none;color:var(--text);border-color:var(--text)}
.btn.out:hover{background:var(--text);color:var(--bg)}
.btn.full{display:block;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.hero{position:relative;background:var(--bg);overflow:hidden}
.hero-in{display:grid;grid-template-columns:1fr}
.ht{padding:32px 20px 18px;align-self:center}
.hero h1{font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:900;font-size:clamp(2.1rem,9vw,4rem);line-height:1.04;letter-spacing:-.02em;margin:0 0 14px}
.hero p{color:var(--muted);max-width:430px;margin:0 0 22px;font-size:.92rem}

const norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ");
function near(a,b){if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++}else{if(++e>1)return false;if(a.length>b.length)i++;else if(a.length<b.length)j++;else{i++;j++}}}return e+(a.length-i)+(b.length-j)<=1}

function matches(q){
  const toks=norm(q).split(" ").filter(x=>x.length>1);if(!toks.length)return[];
  const out=[];
  PRODUCTS.forEach((p,i)=>{let tot=0;
    for(const tk of toks){let best=0;for(const w of p.w){let s=0;if(w===tk)s=3;else if(w.startsWith(tk))s=2.5;else if(tk.length>2&&w.includes(tk))s=1.5;else if(tk.length>3&&near(w,tk))s=1;if(s>best)best=s}if(!best){tot=0;break}for(const w of p.nw){if(w===tk||w.startsWith(tk)){best+=4;break}}tot+=best}
    if(tot){if(norm(pn(p)).includes(norm(q).trim()))tot+=2;out.push([i,tot])}});
  return out.sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}

const CATS=["Sofas","Chairs","Beds","Tables","Dining","Kitchen","Wardrobes"];
const cats=["All",...CATS];
// Chairs = sets that include chairs or armchairs (add single-chair photos later)
const EXTRA={Chairs:["Black Velvet Chesterfield Set","Grey Boucle Sofa Set","Grey Sofa Set with Ottoman","Curved Ribbed Sofa Set","Oval Marble Dining Set","Dining Set with Teal Chairs"]};
const inCat=(p,c)=>p[1]===c||(EXTRA[c]||[]).includes(p[0]);
const catBtns=[];
/* ---- products grid ---- */
function itemBtn(i,badge){const p=PRODUCTS[i],b=document.createElement("button");b.className="item";b.appendChild(im(p[2][0],pn(p)));b.insertAdjacentHTML("beforeend",(badge?'<span class="newb"></span>':"")+'<div class="info"><b></b><span></span></div>');if(badge)b.querySelector(".newb").textContent=t("newb");b.querySelector(".info b").textContent=pn(p);b.querySelector(".info span").textContent=cn(p[1]);b.onclick=()=>openP(i);return b}
function render(){
  catBtns.forEach(x=>{x[1].classList.toggle("on",x[0]===cat&&!term);x[1].querySelector("b").textContent=cn(x[0])});
  $("filters").innerHTML="";
  cats.forEach(c=>{const b=document.createElement("button");b.textContent=c==="All"?t("all"):cn(c);if(c===cat&&!term)b.className="on";b.onclick=()=>{cat=c;term="";$("q2").value="";closeSug();render()};$("filters").appendChild(b)});
  const list=term?matches(term):PRODUCTS.map((_,i)=>i).filter(i=>cat==="All"||inCat(PRODUCTS[i],cat));
  const g=document.createDocumentFragment();list.forEach(i=>g.appendChild(itemBtn(i)));
  $("grid").innerHTML="";
  if(list.length)$("grid").appendChild(g);else{const d=document.createElement("div");d.className="none";d.textContent=t("noRes")+" “"+term+"”. ";const a=document.createElement("a");a.textContent=t("askWa");a.href=wa(t("hello")+" ("+term+")");a.target="_blank";a.rel="noopener";d.appendChild(document.createElement("br"));d.appendChild(document.createTextNode(t("tryWa")+": "));d.appendChild(a);$("grid").appendChild(d)}
}
function buildCats(){
  $("cats").innerHTML="";catBtns.length=0;
  cats.slice(1).forEach(n=>{const b=document.createElement("button");b.className="cat";b.innerHTML='<svg viewBox="0 0 24 24">'+(ICO[n]||ICO.Tables)+'</svg><b></b>';
    b.onclick=()=>{cat=n;term="";$("q2").value="";closeSug();render();goTo($("products"))};
    catBtns.push([n,b]);$("cats").appendChild(b)});
}
function buildArrivals(){$("arrGrid").innerHTML="";CONFIG.newArrivals.forEach(n=>{const i=PRODUCTS.findIndex(p=>p[0]===n);if(i>=0)$("arrGrid").appendChild(itemBtn(i,true))})}
/* ---- header suggestions ---- */
function closeSug(){$("sug").classList.remove("open")}
function showSug(){
  if(!term){closeSug();return}
  const r=matches(term),box=$("sug");box.innerHTML="";
  r.slice(0,6).forEach(i=>{const p=PRODUCTS[i],b=document.createElement("button");b.appendChild(im(p[2][0],pn(p)));b.insertAdjacentHTML("beforeend","<div><b></b><span></span></div>");b.querySelector("b").textContent=pn(p);b.querySelector("span").textContent=cn(p[1]);b.onclick=()=>{closeSug();openP(i)};box.appendChild(b)});
  const f=document.createElement("div");f.className="sugf";
  if(r.length){const a=document.createElement("a");a.textContent=t("seeAll")+" ("+r.length+")";a.onclick=()=>{closeSug();goTo($("products"))};f.appendChild(a)}
  else{f.append(t("noRes")+" “"+term+"”. ");const a=document.createElement("a");a.textContent=t("askWa");a.href=wa(t("hello")+" ("+term+")");a.target="_blank";a.rel="noopener";f.appendChild(a)}
  box.appendChild(f);box.style.top=($("hd").getBoundingClientRect().bottom+6)+"px";box.classList.add("open");
}
function setTerm(v,top){term=v.trim();if(term)cat="All";render();if(top)showSug()}
$("q2").oninput=e=>setTerm(e.target.value,true);
$("q2").onfocus=()=>{if(term)showSug()};
$("q2").onkeydown=e=>{if(e.key==="Enter"){closeSug();$("q2").blur();goTo($("products"))}};
document.addEventListener("click",e=>{if(!e.target.closest("#sug,.hsearch"))closeSug()});
/* ---- order message: name + photo link + product link ---- */
const SITE=(()=>{try{if(CONFIG.siteUrl)return CONFIG.siteUrl.replace(/\/?$/,"/");if(/^https?:$/.test(location.protocol)&&!/claude|anthropic/i.test(location.hostname))return location.href.split(/[?#]/)[0].replace(/[^\/]*$/,"")}catch(e){}return""})();
function orderText(p){const k=p[2][0],l=[t("order")+pn(p)];if(SITE){if(CONFIG.photoLinks)l.push(SITE+"photos/"+k+".jpg");l.push(SITE+"#p-"+k)}return l.join("\n")}
/* ---- product modal ---- */
const closeM=()=>$("modal").classList.remove("open");
function openP(i){
  const p=PRODUCTS[i];
  $("sheet").innerHTML='<button class="close" aria-label="Close">×</button><img class="big" alt=""><div class="thumbs"></div><div class="body"><span class="tag"></span><h2></h2><p class="d"></p><a class="btn full buy" target="_blank" rel="noopener"></a></div>';
  const s=$("sheet"),big=s.querySelector(".big");big.src=IMG[p[2][0]];big.alt=pn(p);
  if(p[2].length>1)p[2].forEach((k,j)=>{const x=new Image();x.src=IMG[k];x.alt=pn(p)+" "+(j+1);if(!j)x.className="on";x.onclick=()=>{big.src=IMG[k];s.querySelectorAll(".thumbs img").forEach(y=>y.classList.remove("on"));x.classList.add("on")};s.querySelector(".thumbs").appendChild(x)});
  s.querySelector(".tag").textContent=cn(p[1]);s.querySelector("h2").textContent=pn(p);s.querySelector(".d").textContent=pd(p);
  const b=s.querySelector(".buy");b.textContent=t("orderWa");b.href=wa(orderText(p));
  s.querySelector(".close").onclick=closeM;$("modal").classList.add("open");
}
$("modal").onclick=e=>{if(e.target===$("modal"))closeM()};
/* ---- videos (load only when tapped, so the page stays fast) ---- */
const PLAY='<span class="play"><i><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></i></span><span class="vtitle"></span>';
function buildVideos(){
  const box=$("vids");box.innerHTML="";
  if(!CONFIG.videos.length){const a=document.createElement("a");a.className="vcard";a.href=IG;a.target="_blank";a.rel="noopener";a.appendChild(im("w0023",""));a.insertAdjacentHTML("beforeend",PLAY);a.querySelector(".vtitle").textContent=t("vidBtn")+" @"+CONFIG.instagram;box.appendChild(a);return}
  CONFIG.videos.forEach(v=>{const c=document.createElement("div");c.className="vcard";c.tabIndex=0;c.setAttribute("role","button");c.appendChild(im(v.poster||"w0023",v.title||""));c.insertAdjacentHTML("beforeend",PLAY);c.querySelector(".vtitle").textContent=v.title||"";
    const go=()=>{if(c.dataset.on)return;c.dataset.on=1;c.innerHTML="";
      if(v.youtube){const f=document.createElement("iframe");f.src="https://www.youtube-nocookie.com/embed/"+v.youtube+"?autoplay=1&rel=0";f.allow="autoplay; fullscreen";f.allowFullscreen=true;f.title=v.title||"Video";c.appendChild(f)}
      else{const d=document.createElement("video");d.src=v.src;d.controls=true;d.autoplay=true;d.playsInline=true;d.preload="metadata";d.onerror=()=>{c.innerHTML="";const a=document.createElement("a");a.className="play";a.href=IG;a.target="_blank";a.rel="noopener";a.style.color="#fff";a.textContent=t("vidBtn");c.appendChild(a)};c.appendChild(d)}};
    c.onclick=go;c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}};box.appendChild(c)});
}
/* ---- hero slider ---- */
let si=0,sT;
SL.forEach(x=>{const m=new Image();m.src=IMG[x[0]];m.decoding="async";m.draggable=false;$("strip").appendChild(m)});
function drawNums(){$("nums").innerHTML="";SL.forEach((x,i)=>{const b=document.createElement("button");b.textContent="0"+(i+1);b.className=i===si?"on":"";b.setAttribute("aria-label","Slide "+(i+1));b.onclick=()=>{show(i);playS()};$("nums").appendChild(b);if(i===si)$("nums").appendChild(document.createElement("i"))})}
function show(n){si=(n+SL.length)%SL.length;$("strip").style.transform="translateX(-"+si*100+"%)";const o=L==="rw"?3:L==="fr"?5:1;$("callA").textContent=SL[si][o];$("callB").textContent=SL[si][o+1];drawNums()}
function playS(){clearInterval(sT);sT=setInterval(()=>{if(!document.hidden)show(si+1)},4500)}
const slideP=()=>PRODUCTS.findIndex(p=>p[2].includes(SL[si][0]));
$("pimg").onclick=()=>openP(slideP());
let tx=null;const bl=document.querySelector(".blob");
bl.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
bl.addEventListener("touchend",e=>{if(tx!==null){const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40){show(si+(d<0?1:-1));playS()}tx=null}});
/* ---- testimonials ---- */
let ci=0,timer;
REVIEWS.forEach((r,i)=>{const d=document.createElement("i");d.onclick=()=>{go(i);auto()};$("dots").appendChild(d)});
function drawReviews(){$("track").innerHTML="";const o=L==="rw"?1:L==="fr"?2:0;REVIEWS.forEach(r=>{const s=document.createElement("div");s.className="slide";s.innerHTML='<div class="stars">★★★★★</div><p></p><b></b>';s.querySelector("p").textContent=L==="fr"?"« "+r[o]+" »":"“"+r[o]+"”";s.querySelector("b").textContent=r[3];$("track").appendChild(s)})}
function go(n){ci=(n+REVIEWS.length)%REVIEWS.length;$("track").style.transform="translateX(-"+ci*100+"%)";[...$("dots").children].forEach((d,i)=>d.classList.toggle("on",i===ci))}
function auto(){clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)go(ci+1)},4500)}
let sx=null;
$("car").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;clearInterval(timer)},{passive:true});
$("car").addEventListener("touchend",e=>{if(sx!==null){const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)go(ci+(dx<0?1:-1));sx=null}auto()});
/* ---- contact form ---- */
function updSend(){const n=$("cName").value.trim(),m=$("cMsg").value.trim();$("cSend").href=wa((n?t("iam")+n+". ":"")+(m||t("hello")))}
$("cName").oninput=$("cMsg").oninput=updSend;
/* ---- language ---- */
function applyLang(){
  document.documentElement.lang=L;$("lang").value=L;
  document.querySelectorAll("[data-t]").forEach(e=>{e.textContent=t(e.dataset.t)});
  document.querySelectorAll("[data-tp]").forEach(e=>{e.placeholder=t(e.dataset.tp)});
  document.title=t("title");$("metaDesc").content=t("desc");
  $("aboutText").textContent=t("about");$("hours").textContent=t("hours");
  $("waMain").href=$("waFloat").href=wa(t("hello"));updSend();
  $("igTxt").textContent=t("follow")+" @"+CONFIG.instagram;
  buildCats();buildArrivals();buildVideos();render();drawReviews();go(ci);show(si);
  [...$("strip").children].forEach((m,i)=>{const p=PRODUCTS[PRODUCTS.findIndex(x=>x[2].includes(SL[i][0]))];m.alt=pn(p)});
  closeSug();closeM();setHH();
}
$("lang").onchange=e=>{L=e.target.value;try{localStorage.setItem("lang",L)}catch(x){}applyLang()};
/* ---- reliable jumps to sections ---- */
function hhv(){return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hh"))||100}
function setHH(){const safe=parseFloat(getComputedStyle(document.documentElement).paddingTop)||0;document.documentElement.style.setProperty("--hh",(safe+$("hd").offsetHeight-0+4)+"px")}
function goTo(el){const p=()=>el.getBoundingClientRect().top-hhv();setHH();scrollTo({top:Math.max(0,scrollY+p()),behavior:"smooth"});clearTimeout(goTo.t);goTo.t=setTimeout(()=>{const d=p();if(Math.abs(d)>3)scrollTo({top:Math.max(0,scrollY+d)})},900)}
document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener("click",e=>{const id=a.getAttribute("href").slice(1),el=id&&$(id);if(el){e.preventDefault();goTo(el)}}));
addEventListener("resize",setHH);addEventListener("load",setHH);
/* ---- static fields ---- */
$("name").textContent=$("name2").textContent=CONFIG.name;
$("addr").textContent=CONFIG.address;$("phone").textContent=CONFIG.phone;$("phoneA").href="tel:+"+CONFIG.whatsapp;
$("yr").textContent=new Date().getFullYear();
$("igBtn").href=$("igFoot").href=$("igTop").href=IG;$("igFoot").textContent="@"+CONFIG.instagram;
if(CONFIG.logo)$("logoBox").innerHTML='<img alt="'+CONFIG.name+' logo" src="'+CONFIG.logo+'">';
$("devWa").href="https://wa.me/"+CONFIG.dev.whatsapp+"?text="+encodeURIComponent("Hello Manzi, I saw the website you built.");$("devWa").textContent=CONFIG.dev.phone;
/* ---- scroll effects (light) ---- */
const io=("IntersectionObserver"in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1}):null;
document.querySelectorAll(".rv").forEach(el=>io?io.observe(el):el.classList.add("in"));
const nio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const id=e.target.id==="categories"?"products":e.target.id==="reviews"||e.target.id==="video"?"about":e.target.id;document.querySelectorAll("#links a").forEach(a=>{const on=a.getAttribute("href")==="#"+id;a.classList.toggle("act",on);if(on){const l=$("links");l.scrollTo({left:a.offsetLeft-(l.clientWidth-a.offsetWidth)/2,behavior:"smooth"})}})}}),{rootMargin:"-40% 0px -55% 0px"});
["home","categories","arrivals","products","about","video","reviews","contact"].forEach(s=>nio.observe($(s)));
/* ---- SEO structured data ---- */
const ld=document.createElement("script");ld.type="application/ld+json";
ld.textContent=JSON.stringify({"@context":"https://schema.org","@graph":[
{"@type":"FurnitureStore","name":CONFIG.name,"description":T.en.about,"telephone":"+"+CONFIG.whatsapp,"address":{"@type":"PostalAddress","streetAddress":CONFIG.address,"addressLocality":"Kigali","addressCountry":"RW"},"areaServed":"Kigali, Rwanda","openingHours":"Mo-Sa 08:00-18:00","contactPoint":{"@type":"ContactPoint","telephone":"+"+CONFIG.whatsapp,"contactType":"sales"},"sameAs":[IG],"knowsLanguage":["en","rw","fr"]},
{"@type":"ItemList","name":"Furniture collection","itemListElement":PRODUCTS.map((p,i)=>({"@type":"ListItem","position":i+1,"name":p[0],"description":p[3]}))}]});
document.head.appendChild(ld);
applyLang();playS();auto();
const hm=location.hash.match(/^#p-(w\d+)/);if(hm){const i=PRODUCTS.findIndex(p=>p[2][0]===hm[1]);if(i>=0)setTimeout(()=>openP(i),400)}
</script>
</body>
</html>
